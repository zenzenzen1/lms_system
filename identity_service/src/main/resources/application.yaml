#   valid-duration: 10 # seconds
  valid-duration: 36000 # seconds
  refreshable-duration: 36000 # seconds
  
app:
  services:
    lms: ${LMS_SCHEDULE_SERVICE:http://localhost:8086/lms_schedule_service}
    # lms: http://lms-system-service:8081/lms
  redis:
    redis-host: ${REDIS_HOST:127.0.0.1}
    redis-port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: '*'

