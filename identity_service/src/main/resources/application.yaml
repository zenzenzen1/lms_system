
spring:
  config:
    import: optional:configserver:http://localhost:8101
  profiles:
    active: ${ACTIVE_PROFILE:dev}
  application:
    name: lms-identity-service
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost:9095}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # value-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5500/lms_identity_service}"
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
  jpa: 
    hibernate: 
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': false
