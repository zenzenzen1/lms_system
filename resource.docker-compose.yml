version: '3.8'
services:
    jenkins:
      image: jenkins/jenkins:2.516.1-lts
      container_name: jenkins
      ports:
        - "8181:8080"  # Web UI
        - "50009:50000"  # Agent communication
      # volumes:
      #   - jenkins_home:/var/jenkins_home
      restart: always
    nexus:
      container_name: nexus
      hostname: nexus
      image: sonatype/nexus3
      ports:
        - "9081:8081"   # Nexus web UI
        - "9082:8082"   
      environment:
        INSTALL4J_ADD_VM_PARAMS: "-Xms512m -Xmx1024m -XX:MaxDirectMemorySize=2G -Djava.util.prefs.userRoot=/nexus-data/javaprefs"
        NEXUS_SECURITY_RANDOMPASSWORD: false
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:9081"]
        interval: 30s
        timeout: 10s
        retries: 10
      networks:
          - lms_network
      restart: always
    #   volumes:
    #     - ./nexus-data:/nexus-data
    identity-service-db:
        image: postgres
        restart: always
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=123
        ports:
            - '5500:5432'
        volumes:
            - ./sql/identity_service_initdb.sql:/docker-entrypoint-initdb.d/init-script.sql
        networks:
            - lms_network
    schedule-service-db:
        image: postgres
        restart: always
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=123
        ports:
            - '5510:5432'
        volumes:
            - ./sql/schedule_service_initdb.sql:/docker-entrypoint-initdb.d/init-script.sql
        networks:
            - lms_network
    user-service-db:
        image: postgres
        restart: always
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=123
        ports:
            - '5511:5432'
        volumes:
            - ./sql/user_service_initdb.sql:/docker-entrypoint-initdb.d/init-script.sql
        networks:
            - lms_network
    # pgadmin-service:
    #     image: dpage/pgadmin4
    #     restart: always
    #     environment:
    #         - PGADMIN_DEFAULT_EMAIL=email@gmail.com
    #         - PGADMIN_DEFAULT_PASSWORD=root
    #     ports:
    #         - "8070:80"
    #     depends_on:
    #         - identity-service-db
    #         - schedule-service-db
    #     networks:
    #         - lms_network
    redis-service:
        hostname: redis-host
        image: redis:7.2.5
        container_name: lms_redis_service
        restart: always
        ports:
            - "6379:6379"
        networks:
            - lms_network
        environment:
            - REDIS_PORT=6379
    mongo:
        hostname: mongo-host
        container_name: lms_mongo_db
        image: mongo:noble
        restart: always
        ports:
            - '27117:27017'
        environment:
          - MONGO_INITDB_ROOT_USERNAME=root
          - MONGO_INITDB_ROOT_PASSWORD=123
        networks:
            - lms_network
    # kafka:
    #     image: 'bitnami/kafka:3.7.0'
    #     container_name: kafka
    #     hostname: kafka
    #     ports:
    #         - '9094:9094'
    #     restart: always
    #     environment:
    #         - KAFKA_CFG_NODE_ID=0
    #         - KAFKA_CFG_PROCESS_ROLES=controller,broker
    #         - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
    #         - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
    #         - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://kafka:9094
    #         - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
    #         - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    #     networks:
    #         - lms_network
    kafka:
      image: bitnami/kafka:3.7.0
      hostname: kafka
      container_name: kafka
      ports:
        - "9092:9092" 
      environment:
        - KAFKA_CFG_NODE_ID=1
        - KAFKA_KRAFT_MODE=true
        - KAFKA_CFG_PROCESS_ROLES=broker,controller
        - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
        - KAFKA_CFG_LISTENERS=PLAINTEXT_INTERNAL://:29092,PLAINTEXT_EXTERNAL://:9092,CONTROLLER://:9093
        - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092
        - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
        - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT_INTERNAL
        - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER 
        - ALLOW_PLAINTEXT_LISTENER=yes
      networks:
        - lms_network
